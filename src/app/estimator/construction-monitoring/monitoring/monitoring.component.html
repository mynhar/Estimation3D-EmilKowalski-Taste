<div class="page-wrapper ecm">

  <header class="ecm-head">
    <a mat-button class="ecm-back" routerLink="/estimator/construction-monitoring/list">
      <mat-icon>arrow_back</mat-icon>
      {{ 'common.back' | translate }}
    </a>
    <!-- El número del dossier lo da la cabecera de la tarjeta de obra. -->
    <app-page-header [titulo]="'construction_monitoring.title' | translate" />
  </header>

  @if (cargando()) {
    <span class="skel" role="status">
      <span class="cdk-visually-hidden">{{ 'common.loading' | translate }}</span>
    </span>

  } @else if (error()) {
    <p class="ecm-error" role="alert">
      <mat-icon aria-hidden="true">error</mat-icon>
      {{ error() }}
    </p>

  <!-- El contrato no está entre los expedientes de este estimador -->
  } @else if (noAccesible()) {
    <app-empty-state class="ecm-empty" matIcon="lock"
                     [titulo]="'estimator_monitoring.no_access_title' | translate"
                     [texto]="'estimator_monitoring.no_access_hint' | translate" />

  <!-- Sin seguimiento para este contrato -->
  } @else if (!obra()) {
    <app-empty-state class="ecm-empty" matIcon="construction"
                     [titulo]="'client_monitoring.empty_title' | translate"
                     [texto]="'client_monitoring.empty_hint' | translate" />

  } @else {
    <app-obra-card [obra]="obra()!" />
  }
</div>
