@if (total() > pageSize()) {
  <div class="pg">
    <p class="pg__info">
      {{ from() }}&ndash;{{ to() }} {{ 'pagination.of' | translate }} {{ total() }}
    </p>
    <nav [attr.aria-label]="'pagination.label' | translate">
      <ul class="pg__list">
        <li>
          <button type="button" class="pg__btn pg__btn--arrow" (click)="prev()"
                  [disabled]="page() === 1" [attr.aria-label]="'pagination.prev' | translate">
            <mat-icon aria-hidden="true">chevron_left</mat-icon>
          </button>
        </li>

        @for (p of pages(); track $index) {
          <li>
            @if (p === '...') {
              <span class="pg__gap" aria-hidden="true">…</span>
            } @else {
              <button type="button" class="pg__btn" (click)="go(p)"
                      [class.is-current]="p === page()"
                      [attr.aria-current]="p === page() ? 'page' : null">{{ p }}</button>
            }
          </li>
        }

        <li>
          <button type="button" class="pg__btn pg__btn--arrow" (click)="next()"
                  [disabled]="page() === totalPages()" [attr.aria-label]="'pagination.next' | translate">
            <mat-icon aria-hidden="true">chevron_right</mat-icon>
          </button>
        </li>
      </ul>
    </nav>
  </div>
}
