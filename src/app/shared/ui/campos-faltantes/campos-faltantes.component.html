@if (visible()) {
  <section #panel class="cf" tabindex="-1" [attr.aria-labelledby]="tituloId">
    <p class="cf__title" [id]="tituloId">
      <!-- SVG propio (no una fuente de iconos): el resumen vive en pantallas de los dos sets. -->
      <svg class="cf__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M12 7.5v5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <circle cx="12" cy="16.5" r="1.25" fill="currentColor" />
      </svg>
      {{ titulo() | translate: { n: faltantes().length } }}
    </p>

    <ul class="cf__list">
      @for (f of faltantes(); track f.id) {
        <li class="cf__item">
          @if (f.el) {
            <button type="button" class="cf__link" (click)="irA(f)">{{ f.etiqueta }}</button>
          } @else {
            <span class="cf__name">{{ f.etiqueta }}</span>
          }
          <!-- Si todos faltan, el título ya lo dice: el motivo sólo aparece
               cuando hay campos mal escritos en la lista. -->
          @if (!todosRequeridos()) {
            <span class="cf__reason">{{ f.motivo | translate: f.params }}</span>
          }
        </li>
      }
    </ul>
  </section>
}
