<!-- Confirmación de archivo o desarchivo: explica qué cambia antes de hacerlo. -->
@if (confirmando()) {
  <section class="ar" role="alertdialog"
           [id]="panelId"
           [attr.aria-labelledby]="panelId + '-title'"
           [attr.aria-describedby]="panelId + '-desc'"
           (keydown.escape)="cancelar()">
    @if (enCursoDesarchivar()) { <mat-icon class="ar__icon" aria-hidden="true">unarchive</mat-icon> } @else { <mat-icon class="ar__icon" aria-hidden="true">archive</mat-icon> }
    <div class="ar__body">
      <h2 class="ar__title" [id]="panelId + '-title'">{{ textos().titulo | translate }}</h2>
      <p class="ar__desc" [id]="panelId + '-desc'">{{ textos().desc | translate }}</p>
      @if (error()) {
        <p class="ar__error" role="alert"><mat-icon aria-hidden="true">error</mat-icon>{{ error() }}</p>
      }
    </div>
    <!-- Reversible: el «sí» es abeto, no tomate ni ladrillo. Foco inicial en «Cancelar». -->
    <div class="ar__actions">
      <button #botonNo mat-button type="button" [disabled]="archivando()" (click)="cancelar()">
        {{ 'common.cancel' | translate }}
      </button>
      <button mat-flat-button type="button"
              [disabled]="archivando()" [attr.aria-busy]="archivando()"
              (click)="confirmar()">
        @if (archivando()) { <span class="ar__spinner" aria-hidden="true"></span> } @else { <mat-icon>check</mat-icon> }
        {{ (archivando() ? textos().enCurso : textos().ok) | translate }}
      </button>
    </div>
  </section>
}
